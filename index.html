<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو الذكاء الاصطناعي - إيفان</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #4ea8de;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            text-align: right;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #0d1b2a;
            border: 1px solid #415a77;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #0077b6;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0096c7;
        }
        #result {
            margin-top: 15px;
            font-size: 15px;
            font-weight: bold;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>استوديو الذكاء الاصطناعي</h2>
        
        <label>صف اللحن أو الموسيقى:</label>
        <input type="text" id="musicInput" value="موسيقى راب حماسية لإيفان" placeholder="موسيقى وبيت سعاده">
        
        <label>اكتب الكلمات الجديدة:</label>
        <textarea id="lyricsInput" rows="4" placeholder="اكتب كلمات الأغنية هنا...">إيفان يا عزوة وفخر الجيل...</textarea>
        
        <!-- زر التوليد -->
        <button id="generateBtn">توليد الأغنية</button>
        
        <div id="result"></div>
        
        <!-- مشغل الصوت (مخفي حتى يتم التوليد) -->
        <audio id="audioPlayer" controls style="display: none;">
            <!-- رابط مقطع صوتي تجريبي حقيقي يعمل مباشرة -->
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            متصفحك لا يدعم مشغل الصوت
        </audio>
    </div>

    <!-- كود الجافاسكريبت للتشغيل والتفاعل -->
    <script>
        const btn = document.getElementById( generateBtn );
        if (btn) {
            btn.addEventListener( click , function() {
                const musicEl = document.getElementById( musicInput );
                const lyricsEl = document.getElementById( lyricsInput );
                const resultDiv = document.getElementById( result );
                const audioPlayer = document.getElementById( audioPlayer );

                if (!musicEl || !lyricsEl || !resultDiv) return;

                const music = musicEl.value.trim();
                const lyrics = lyricsEl.value.trim();

                if (!music || !lyrics) {
                    resultDiv.style.color = "#ff6b6b";
                    resultDiv.innerHTML = "⚠️ الرجاء تعبئة وصف اللحن والكلمات أولاً!";
                    return;
                }

                resultDiv.style.color = "#4ea8de";
                resultDiv.innerHTML = "⏳ جاري توليد الأغنية ومعالجة الصوت...";
                audioPlayer.style.display = "none";

                // محاكاة وقت التوليد ثم إظهار وتشغيل الأغنية الحقيقية
                setTimeout(() => {
                    resultDiv.style.color = "#52b788";
                    resultDiv.innerHTML = "✅ تم توليد الأغنية بنجاح!";
                    
                    // إظهار مشغل الصوت وبدء التشغيل
                    audioPlayer.style.display = "block";
                    audioPlayer.play().catch(e => {
                        console.log("التشغيل التلقائي يتطلب نقرة من المستخدم");
                    });
                }, 2500);
            });
        }
    </script>

    <!-- أداة المطورين لمراقبة الأخطاء إن وجدت -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

</body>
</html>
